server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

  # sensors / camera / xr need a secure context; Cloud Run terminates TLS.
  add_header Permissions-Policy "camera=(self), geolocation=(self), magnetometer=(self), accelerometer=(self), gyroscope=(self), xr-spatial-tracking=(self)" always;
  add_header X-Content-Type-Options "nosniff" always;

  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
  location = /sw.js { add_header Cache-Control "no-cache"; }
  location = /manifest.webmanifest { add_header Cache-Control "no-cache"; }
  location / { try_files $uri $uri/ /index.html; }
}
